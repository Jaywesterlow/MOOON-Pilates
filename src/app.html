<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#F0ECE6" />
		<!-- reveal targets start hidden only when JS runs; see "Reveal pre-state" in src/app.css -->
		<script>
			document.documentElement.classList.add('js');
		</script>
		<link rel="preload" href="/fonts/aboreto-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/afacad-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
